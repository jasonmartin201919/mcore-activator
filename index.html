<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCORE 系统工具箱 - 免安装版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #0f172a; --accent: #6366f1; }
        body { background-color: var(--bg); color: white; font-family: system-ui, sans-serif; overflow: hidden; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* 10秒强制等待的遮罩层 */
        #adOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 模拟进度条 */
        .progress-container { width: 300px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 1s linear; }
        
        /* 广告容器占位 - 软件端内嵌的核心 */
        .ad-slot-loading {
            width: 100%;
            max-width: 728px;
            height: 280px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            border-radius: 12px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div id="adOverlay">
    <div class="text-center space-y-4 w-full max-w-2xl px-6">
        <h2 class="text-xl font-bold tracking-widest text-indigo-400">正在高速处理中...</h2>
        <p class="text-gray-400 text-xs">免费版由下方广告赞助支持</p>
        
        <div class="ad-slot-loading" id="adSlotInternal">
            <div class="text-gray-600 text-sm">
                <p>广告加载区 (CPM/CPC Ad Slot)</p>
                <p class="text-[10px] mt-2">支持 728x280 或响应式横幅</p>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <div class="progress-container">
                <div id="pBar" class="progress-bar"></div>
            </div>
            <button id="skipBtn" disabled class="px-8 py-3 bg-white/5 border border-white/10 rounded-xl text-gray-500 text-sm font-bold transition-all">
                请稍候 <span id="countdown">10</span>s
            </button>
        </div>
    </div>
</div>

<div id="mainContent" class="glass rounded-[2.5rem] w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[550px]">
    
    <div class="p-10 md:p-16 flex flex-col justify-center items-center md:items-start md:w-2/5 border-b md:border-b-0 md:border-r border-white/5 bg-white/5">
        <h1 class="text-6xl font-black mb-2 tracking-tighter">MCORE</h1>
        <p class="text-indigo-400 text-[10px] font-bold tracking-[0.4em] uppercase mb-8">Free Edition</p>
        
        <div class="mb-8 space-y-1">
            <p class="text-2xl font-mono font-bold text-white">158,492</p>
            <p class="text-[10px] text-gray-500 uppercase font-bold">累计下载次数 (已虚增)</p>
        </div>

        <button onclick="triggerAction()" class="group flex items-center gap-4 px-10 py-5 bg-indigo-600 hover:bg-indigo-500 rounded-2xl transition-all shadow-lg shadow-indigo-500/20">
            <span class="font-bold tracking-widest text-sm">立即启动查重</span>
        </button>
    </div>

    <div class="p-10 md:p-16 flex-1 flex flex-col justify-center bg-black/10">
        <div class="w-full h-32 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center mb-10">
            <span class="text-gray-600 text-xs">Banner 广告位 (300x100)</span>
        </div>

        <div class="space-y-6">
            <div class="p-8 bg-indigo-500/5 border border-indigo-500/10 rounded-3xl">
                <p class="text-[10px] text-indigo-400 uppercase tracking-[0.2em] font-bold mb-4">官方公众号</p>
                <div class="flex items-center gap-6">
                    <div class="w-20 h-20 bg-white rounded-xl flex items-center justify-center text-black font-bold text-xs">二维码</div>
                    <div>
                        <p class="text-lg font-bold">关注 MCORE 团队</p>
                        <p class="text-sm text-gray-400">获取最新免安装工具包</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 核心逻辑：模拟处理并显示广告
    function triggerAction() {
        const overlay = document.getElementById('adOverlay');
        const skipBtn = document.getElementById('skipBtn');
        const countdownSpan = document.getElementById('countdown');
        const pBar = document.getElementById('pBar');
        
        overlay.style.display = 'flex';
        let count = 10;
        
        const timer = setInterval(() => {
            count--;
            countdownSpan.innerText = count;
            pBar.style.width = ((10 - count) * 10) + '%';
            
            if (count <= 0) {
                clearInterval(timer);
                skipBtn.disabled = false;
                skipBtn.innerText = "立即进入功能";
                skipBtn.classList.remove('text-gray-500');
                skipBtn.classList.add('bg-indigo-600', 'text-white', 'hover:bg-indigo-500');
                skipBtn.onclick = () => {
                    overlay.style.display = 'none';
                    // 这里执行你真正的启动逻辑
                    alert("查重引擎已启动！");
                };
            }
        }, 1000);
    }
</script>
</body>
</html>
