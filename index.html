<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCORE Team - 官方发布中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #020617; --accent: #6366f1; }
        body { background-color: var(--bg); color: white; font-family: 'PingFang SC', system-ui; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-value { font-family: 'Monaco', monospace; background: linear-gradient(to bottom, #fff, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <div class="fixed inset-0 hero-gradient pointer-events-none"></div>

    <div class="relative z-10 max-w-6xl mx-auto px-6 py-12 md:py-24">
        
        <div class="mb-16 w-full max-w-4xl mx-auto">
            <p class="text-[10px] text-gray-600 uppercase tracking-widest text-center mb-2">Sponsored Ad</p>
            <div class="w-full h-24 md:h-32 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center overflow-hidden">
                <span class="text-gray-700 text-sm">Banner Ad Slot</span>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-16 items-center">
            
            <div class="space-y-8">
                <div>
                    <h1 class="text-7xl font-black tracking-tighter mb-4">MCORE</h1>
                    <p class="text-xl text-gray-400">重新定义 PC 端图片查重效率</p>
                    <p class="text-indigo-400 font-bold tracking-widest text-sm mt-2">FREE & UNLIMITED EDITION</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-6 rounded-3xl">
                        <div id="downloadCount" class="text-3xl font-bold stat-value">158,420</div>
                        <div class="text-[10px] text-gray-500 uppercase mt-1 tracking-widest">累计下载量</div>
                    </div>
                    <div class="glass-card p-6 rounded-3xl">
                        <div class="text-3xl font-bold stat-value">99.8%</div>
                        <div class="text-[10px] text-gray-500 uppercase mt-1 tracking-widest">查重准确率</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <a href="你的下载链接" class="px-10 py-5 bg-white text-black font-bold rounded-2xl hover:bg-indigo-500 hover:text-white transition-all text-center">
                        立即下载 EXE
                    </a>
                    <div class="px-10 py-5 glass-card rounded-2xl flex items-center justify-center gap-2 border-indigo-500/30">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-sm font-bold">V2.0.1 稳定版</span>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-[3rem] p-10 md:p-12 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-600/10 blur-3xl group-hover:bg-indigo-600/20 transition-all"></div>
                
                <div class="relative z-10 text-center space-y-6">
                    <div class="w-24 h-24 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center rotate-3 shadow-2xl shadow-indigo-600/20">
                        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold">关注微信公众号</h3>
                        <p class="text-gray-400 text-sm">获取免安装版最新动态与技术支持</p>
                    </div>

                    <div class="bg-white p-2 rounded-2xl inline-block shadow-inner">
                        <div class="w-40 h-40 bg-gray-100 rounded-xl flex items-center justify-center text-black text-[10px] font-bold">
                            <img src="your-qrcode.png" alt="QR Code" class="w-full h-full object-cover rounded-xl">
                        </div>
                    </div>

                    <div class="pt-4">
                        <p class="text-xs text-indigo-400 font-bold">搜索公众号：<span class="text-white">您的公众号名</span></p>
                        <p class="text-[10px] text-gray-600 mt-2 italic">私信发送 “MCORE” 获取极速通道</p>
                    </div>
                </div>
            </div>

        </div>

        <footer class="mt-24 pt-8 border-t border-white/5 text-center text-gray-600 text-[10px] tracking-widest uppercase">
            &copy; 2026 MCORE TEAM. ALL RIGHTS RESERVED. 
        </footer>
    </div>

    <script>
        // 虚增下载量跳动脚本
        function animateValue(id, start, duration) {
            const obj = document.getElementById(id);
            let current = start;
            
            setInterval(() => {
                // 每隔几秒增加 1-3 个下载量
                const increment = Math.floor(Math.random() * 3) + 1;
                current += increment;
                obj.innerText = current.toLocaleString();
            }, 3000); // 3秒跳一次
        }
        
        window.onload = () => {
            animateValue("downloadCount", 158420, 0);
        };
    </script>
</body>
</html>
