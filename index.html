<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCORE Team - 官方发布中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #020617; --accent: #6366f1; }
        body { background-color: var(--bg); color: white; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* 增强型高级数字样式 */
        .stat-value { 
            font-family: 'Monaco', 'Consolas', monospace; 
            background: linear-gradient(180deg, #fff 30%, #6366f1 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
            letter-spacing: -1px;
            display: inline-block;
        }

        /* 数字跳动时的轻微缩放动画 */
        @keyframes pulse-soft {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .number-update { animation: pulse-soft 0.3s ease-out; }

        /* 按钮悬停光晕 */
        .btn-glow:hover { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <div class="fixed inset-0 hero-gradient pointer-events-none"></div>

    <div class="relative z-10 max-w-6xl mx-auto px-6 py-12 md:py-24">
        
        <div class="mb-16 w-full max-w-4xl mx-auto">
            <p class="text-[10px] text-gray-600 uppercase tracking-widest text-center mb-2">Sponsored Ad</p>
            <div class="w-full h-24 md:h-32 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center overflow-hidden">
                <span class="text-gray-700 text-sm italic font-mono">Banner Ad Slot - Wait for Ad Code</span>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-16 items-center">
            
            <div class="space-y-8">
                <div class="animate-up">
                    <h1 class="text-7xl font-black tracking-tighter mb-4 italic">MCORE</h1>
                    <p class="text-xl text-gray-400">重新定义 PC 端图片查重效率</p>
                    <p class="text-indigo-400 font-bold tracking-widest text-[11px] mt-2 bg-indigo-500/10 px-3 py-1 rounded-full inline-block">FREE & UNLIMITED EDITION</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-6 rounded-3xl border-l-2 border-l-indigo-500/50">
                        <div id="downloadCount" class="text-4xl font-bold stat-value">158,420</div>
                        <div class="text-[10px] text-gray-500 uppercase mt-2 tracking-[0.2em] font-bold">累计下载总量</div>
                    </div>
                    <div class="glass-card p-6 rounded-3xl">
                        <div class="text-4xl font-bold stat-value italic">99.8<span class="text-2xl font-sans">%</span></div>
                        <div class="text-[10px] text-gray-500 uppercase mt-2 tracking-[0.2em] font-bold">查重准确率</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <a href="你的下载链接" class="btn-glow px-10 py-5 bg-white text-black font-bold rounded-2xl hover:bg-indigo-500 hover:text-white transition-all text-center transform active:scale-95">
                        立即下载 EXE
                    </a>
                    <div class="px-10 py-5 glass-card rounded-2xl flex items-center justify-center gap-3 border-indigo-500/20">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                        <span class="text-sm font-bold tracking-tight">V2.0.1 Stable</span>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-[3rem] p-10 md:p-12 relative overflow-hidden group border border-white/10">
                <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-600/10 blur-3xl group-hover:bg-indigo-600/20 transition-all"></div>
                
                <div class="relative z-10 text-center space-y-6">
                    <div class="w-24 h-24 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center rotate-3 shadow-2xl shadow-indigo-600/20 group-hover:rotate-0 transition-transform duration-500">
                        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold tracking-tight">关注微信公众号</h3>
                        <p class="text-gray-400 text-sm">获取免安装版最新动态与技术支持</p>
                    </div>

                    <div class="bg-white p-2 rounded-2xl inline-block shadow-2xl shadow-black/50">
                        <div class="w-40 h-40 bg-gray-100 rounded-xl flex items-center justify-center overflow-hidden">
                            <img src="your-qrcode.png" alt="QR Code" class="w-full h-full object-cover rounded-xl">
                        </div>
                    </div>

                    <div class="pt-4">
                        <p class="text-xs text-indigo-400 font-bold bg-indigo-500/5 py-2 rounded-lg inline-block px-4">
                            搜索公众号：<span class="text-white">您的公众号名</span>
                        </p>
                        <p class="text-[10px] text-gray-600 mt-4 italic tracking-widest">私信发送 “MCORE” 获取极速通道</p>
                    </div>
                </div>
            </div>

        </div>

        <footer class="mt-24 pt-8 border-t border-white/5 text-center text-gray-700 text-[10px] tracking-[0.3em] uppercase">
            &copy; 2026 MCORE TEAM.
        </footer>
    </div>

    <script>
        // 高级滚动数字逻辑
        function animateCounter(id, target, start) {
            const el = document.getElementById(id);
            let current = start;
            const duration = 1500; // 初始加载动画 1.5 秒
            const frameRate = 1000 / 60;
            const totalFrames = Math.round(duration / frameRate);
            const increment = (target - start) / totalFrames;
            let frame = 0;

            const timer = setInterval(() => {
                frame++;
                current += increment;
                el.innerText = Math.floor(current).toLocaleString();
                if (frame === totalFrames) {
                    clearInterval(timer);
                    el.innerText = target.toLocaleString();
                    startAutoUpdate(id, target); // 加载完后开启自动更新
                }
            }, frameRate);
        }

        // 自动随机增长逻辑
        function startAutoUpdate(id, currentVal) {
            const el = document.getElementById(id);
            let val = currentVal;
            
            setInterval(() => {
                const add = Math.floor(Math.random() * 3) + 1; // 随机加 1-3
                val += add;
                
                // 添加跳动视觉效果
                el.classList.remove('number-update');
                void el.offsetWidth; // 触发重绘
                el.classList.add('number-update');
                
                el.innerText = val.toLocaleString();
            }, 4000); // 每 4 秒动一次
        }

        window.onload = () => {
            // 初始从 158,000 滚动到 158,420
            animateCounter("downloadCount", 158420, 158000);
        };
    </script>
</body>
</html>
