<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCORE | 官方发布中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入自定义字体 */
        @font-face {
            font-family: 'FontquanXinYiGuanHeiTi';
            src: url('https://raw.githubusercontent.com/jasonmartin201919/mcore-activator/main/FontquanXinYiGuanHeiTi-Regular.ttf');
            font-display: swap;
        }

        :root { 
            --bg-main: #F8F9FA;
            --text-dark: #1A1A1A;
        }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-dark); 
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        /* LOGO 区域 */
        .header-logo-area {
            height: 200px;
            width: 100%;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;    
            justify-content: center; 
            border-bottom: 1px solid #EEEEEE;
        }

        .mcore-brand-font {
            font-family: 'FontquanXinYiGuanHeiTi', sans-serif;
            font-size: 1.75rem; 
            font-weight: 900;    
            letter-spacing: 0.1em;
            color: #000;
            margin-top: 12px;
            line-height: 1;
        }

        /* 1. 沉浸式业务展示区 */
        .hero-slider {
            position: relative;
            height: 500px; 
            width: 100%;
            overflow: hidden;
            background: #F3F4F6; /* 默认浅灰色背景 */
            border-bottom: 1px solid #EEEEEE;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .slide-media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.8; 
        }

        .slide.active { opacity: 1; }
        .slide-content { position: relative; z-index: 20; color: #fff; text-shadow: 0 2px 15px rgba(0,0,0,0.5); }
        
        /* 关键修复：无媒体时的文字颜色 */
        .no-media .slide-content { color: #1A1A1A !important; text-shadow: none !important; }
        .no-media { background: #F3F4F6; }

        .slide-h1 { font-size: 3.5rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 1rem; }
        .slide-p { font-size: 1rem; letter-spacing: 0.2em; font-weight: 300; opacity: 0.9; }

        .slider-dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 30;
        }
        .dot { width: 40px; height: 2px; background: rgba(0,0,0,0.1); position: relative; }
        .dot-fill { position: absolute; left:0; top:0; height:100%; width:0; background: #000; }
        .dot.active .dot-fill { width: 100%; transition: width 5000ms linear; }

        /* 2. 下载与社区区 */
        .content-section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        .download-btn {
            background: var(--text-dark);
            color: white;
            padding: 20px 80px;
            font-weight: 600;
            letter-spacing: 0.1em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px;
        }
        .download-btn:hover { background: #000; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        .info-card {
            background: #FFFFFF;
            padding: 50px;
            border: 1px solid #EAEAEA;
        }

        /* 3. 底部广告位 */
        .ad-footer-container {
            max-width: 1100px;
            margin: 0 auto 80px auto;
            padding: 0 40px;
        }
        .ad-box {
            width: 100%;
            min-height: 120px;
            background: #FFF;
            border: 1px solid #EEE;
            display: flex;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            align-items: center;
            justify-content: center;
        }
        .ad-media-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .ad-overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 15px 30px;
            background: rgba(255,255,255,0.85); 
            border-radius: 2px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: fadeInUp 1s ease-out forwards; }
    </style>
</head>
<body>

    <header class="header-logo-area">
        <div class="flex flex-col items-center">
            <img src="https://github.com/jasonmartin201919/mcore-activator/blob/main/MCORE_Industrial_Logo_V6.png?raw=true" 
                 alt="MCORE Logo" 
                 class="h-16 w-auto object-contain pointer-events-none">
            <div class="mcore-brand-font">MCORE</div>
        </div>
    </header>

    <section class="hero-slider" id="heroSlider">
        <div class="slide active" id="slide0">
            <div class="media-container w-full h-full absolute inset-0"></div>
            <div class="slide-content">
                <h1 class="slide-h1">纯粹 · 高效</h1>
                <div class="slide-p">重新定义 PC 端资产清理逻辑</div>
            </div>
        </div>
        <div class="slide" id="slide1">
            <div class="media-container w-full h-full absolute inset-0"></div>
            <div class="slide-content">
                <h1 class="slide-h1">毫秒级比对</h1>
                <div class="slide-p">智能视觉算法识别重复图像</div>
            </div>
        </div>

        <div class="slider-dots">
            <div class="dot active"><div class="dot-fill"></div></div>
            <div class="dot"><div class="dot-fill"></div></div>
        </div>
    </section>

    <main class="content-section">
        <div class="grid md:grid-cols-2 gap-16 items-start">
            <div class="space-y-16 reveal">
                <div class="space-y-6">
                    <h2 class="text-[10px] font-bold tracking-[0.5em] text-gray-400 uppercase">System Status</h2>
                    <div class="flex gap-20">
                        <div>
                            <div id="downloadCount" class="text-6xl font-light tracking-tighter">5,280</div>
                            <div class="text-[11px] text-gray-400 font-bold uppercase tracking-widest mt-3">累计下载次数</div>
                        </div>
                        <div>
                            <div class="text-6xl font-light tracking-tighter">99.8%</div>
                            <div class="text-[11px] text-gray-400 font-bold uppercase tracking-widest mt-3">处理完成率</div>
                        </div>
                    </div>
                </div>

                <div class="pt-10">
                    <a id="mainDownloadBtn" href="https://github.com/jasonmartin201919/mcore-activator/releases" class="download-btn inline-block text-center">立即获取 MCORE</a>
                    <p class="text-[10px] text-gray-400 mt-8 tracking-[0.2em]">稳定版本 v2.0.1 | 适用于 Windows 10/11</p>
                </div>
            </div>

            <div class="info-card reveal" style="animation-delay: 0.2s;">
                <div class="text-center space-y-8">
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold uppercase tracking-[0.4em] text-gray-400">Join Community</h3>
                        <p class="text-sm font-medium">关注微信公众号获取技术支持</p>
                    </div>
                    <div class="p-4 inline-block bg-[#FBFBFB] border border-gray-100">
                        <div class="w-44 h-44 bg-white flex items-center justify-center overflow-hidden">
                            <img src="https://github.com/jasonmartin201919/mcore-activator/blob/main/assets/qrcode.png?raw=true" alt="QR" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/176?text=MCORE+QR'">
                        </div>
                    </div>
                    <div class="text-[11px] font-bold text-gray-400 tracking-widest">
                        搜索公众号：<span class="text-black">MCORE 科技</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <section class="ad-footer-container reveal" style="animation-delay: 0.4s;">
        <div class="ad-box" id="footerAdBox">
            <div class="media-container w-full h-full absolute inset-0"></div>
            <div class="ad-overlay">
                <span class="text-[9px] uppercase tracking-[0.4em] text-gray-400 mb-2 block">Promoted Content</span>
                <div id="footerAdText" class="text-gray-900 text-sm font-bold tracking-widest">加载中...</div>
            </div>
        </div>
    </section>

    <footer class="py-20 text-center border-t border-gray-100 bg-white">
        <div class="flex flex-col items-center mb-4 opacity-40">
            <img src="https://github.com/jasonmartin201919/mcore-activator/blob/main/MCORE_Industrial_Logo_V6.png?raw=true" 
                 alt="MCORE Logo" class="h-8 w-auto">
            <div class="mcore-brand-font" style="font-size: 1rem; margin-top: 5px;">MCORE</div>
        </div>
        <div class="text-[10px] text-gray-400 tracking-[0.6em] uppercase font-medium">MCORE TEAM &copy; 2026</div>
    </footer>

    <script>
        // 配置：如果本地没有 config.json，可以改用 GitHub 的真实地址
        const REMOTE_CONFIG = 'https://raw.githubusercontent.com/jasonmartin201919/mcore-activator/main/config.json';

        // --- 核心逻辑：媒体渲染器 ---
        function renderMedia(container, url) {
            if (!url || url.trim() === "" || url === "#") {
                container.parentElement.classList.add('no-media');
                return;
            }
            container.innerHTML = "";
            const isVideo = /\.(mp4|webm|ogg)$/i.test(url);
            
            if (isVideo) {
                const video = document.createElement('video');
                video.src = url;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.className = container.parentElement.className.includes('ad-box') ? "ad-media-bg" : "slide-media";
                container.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = url;
                img.className = container.parentElement.className.includes('ad-box') ? "ad-media-bg" : "slide-media";
                img.onerror = () => container.parentElement.classList.add('no-media');
                container.appendChild(img);
            }
            container.parentElement.classList.remove('no-media');
        }

        // --- 1. 轮播图切换逻辑 ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const interval = 5000;

        function showSlide(n) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            currentSlide = (n + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
            
            const fill = dots[currentSlide].querySelector('.dot-fill');
            if (fill) {
                fill.style.transition = 'none';
                fill.style.width = '0';
                setTimeout(() => {
                    fill.style.transition = `width ${interval}ms linear`;
                    fill.style.width = '100%';
                }, 50);
            }
        }

        setInterval(() => showSlide(currentSlide + 1), interval);

        // --- 2. 下载量跳动 ---
        let baseCount = 5280;
        function updateCount() {
            baseCount += Math.floor(Math.random() * 3) + 1;
            const el = document.getElementById('downloadCount');
            if(el) el.innerText = baseCount.toLocaleString();
            setTimeout(updateCount, 3000); 
        }

        // --- 3. 动态配置加载 ---
        async function refreshLiveAds() {
            // 策略：先尝试加载本地，本地 404 则加载远程 GitHub
            let configUrl = 'config.json';
            
            try {
                let res = await fetch(configUrl + '?t=' + Date.now());
                if (!res.ok) {
                    console.warn("本地 config.json 未找到，尝试远程路径...");
                    res = await fetch(REMOTE_CONFIG + '?t=' + Date.now());
                }
                
                const data = await res.json();
                const ads = data.ads;

                // 轮播 A
                const s0 = document.getElementById('slide0');
                if (ads.carousel_a_title) s0.querySelector('.slide-h1').innerText = ads.carousel_a_title;
                if (ads.carousel_a_subtitle) s0.querySelector('.slide-p').innerText = ads.carousel_a_subtitle;
                renderMedia(s0.querySelector('.media-container'), ads.carousel_a_media);

                // 轮播 B
                const s1 = document.getElementById('slide1');
                if (ads.carousel_b_title) s1.querySelector('.slide-h1').innerText = ads.carousel_b_title;
                if (ads.carousel_b_subtitle) s1.querySelector('.slide-p').innerText = ads.carousel_b_subtitle;
                renderMedia(s1.querySelector('.media-container'), ads.carousel_b_media);

                // 底部广告
                if (ads.footer_ad_text) document.getElementById('footerAdText').innerText = ads.footer_ad_text;
                renderMedia(document.getElementById('footerAdBox').querySelector('.media-container'), ads.footer_ad_media);

                // 下载链接
                if (ads.download_url) document.getElementById('mainDownloadBtn').href = ads.download_url;

            } catch (e) {
                console.error("配置加载失败:", e);
                slides.forEach(s => s.classList.add('no-media'));
                document.getElementById('footerAdText').innerText = "MCORE: 专注视觉资产清理";
            }
        }

        window.onload = () => {
            showSlide(0);
            updateCount();
            refreshLiveAds();
        };
    </script>
</body>
</html>
