<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>媒体中心 · MCORE 新闻动态</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --dji-blue: #00a0e9; --dji-black: #000; --dji-gray: #707072; }
        body { 
            background-color: #fff; 
            color: var(--dji-black); 
            font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif; 
            -webkit-font-smoothing: antialiased; 
        }

        /* 顶部导航 */
        nav.main-nav { 
            position: fixed; top: 0; width: 100%; height: 56px; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 24px; z-index: 1000; background: #fff;
            border-bottom: 1px solid #eee;
        }
        
        /* 类似大疆的二级分类导航 */
        .sub-nav {
            border-bottom: 1px solid #eee; padding: 15px 0; margin-top: 56px;
            background: #fff;
        }
        .category-item { font-size: 15px; color: var(--dji-black); transition: 0.3s; font-weight: 500; cursor: pointer; }
        .category-item:hover { opacity: 0.6; }
        .category-item.active { border-bottom: 2px solid black; padding-bottom: 4px; }

        /* 焦点新闻样式 */
        .featured-news { position: relative; cursor: pointer; overflow: hidden; }
        .featured-news img { width: 100%; aspect-ratio: 16/9; object-fit: cover; transition: 0.8s; }
        .featured-news:hover img { transform: scale(1.01); }
        
        /* 右侧侧边栏样式 */
        .sidebar-section { border-bottom: 1px solid #eee; padding-bottom: 40px; margin-bottom: 40px; }
        .btn-subscribe { 
            background: var(--dji-blue); color: white; width: 100%; 
            padding: 10px; border-radius: 2px; font-weight: 600; transition: 0.3s;
        }
        .btn-subscribe:hover { background: #0089c7; }

        /* 模态框 */
        #newsModal { display: none; position: fixed; inset: 0; z-index: 2000; background: #fff; overflow-y: auto; padding: 60px 24px; }
    </style>
</head>
<body>

    <nav class="main-nav">
        <a href="index.html"><img src="https://raw.githubusercontent.com/jasonmartin201919/mcore-activator/main/logo02.png" style="height:24px;" alt="MCORE"></a>
        <div class="hidden md:flex gap-8 text-sm font-medium">
            <a href="index.html">首页</a>
            <a href="tech.html">技术探讨</a>
            <a href="download.html">下载中心</a>
            <a href="news.html" class="text-blue-600">新闻动态</a>
        </div>
        <div class="w-10 md:hidden"></div>
    </nav>

    <div class="sub-nav">
        <div class="max-w-7xl mx-auto px-6 flex gap-10 md:gap-20 overflow-x-auto whitespace-nowrap">
            <span class="category-item active">所有动态</span>
            <span class="category-item">媒体报道 (即将上线)</span>
            <span class="category-item">品牌故事 (即将上线)</span>
            <span class="category-item">活动资讯 (即将上线)</span>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex flex-col lg:flex-row gap-16">
            
            <div class="lg:w-2/3">
                <div id="featuredContainer">
                    <div class="h-96 bg-gray-50 animate-pulse rounded"></div>
                </div>
                
                <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-12 mt-16">
                    </div>
            </div>

            <aside class="lg:w-1/3">
                <div class="sidebar-section">
                    <h3 class="text-xl font-bold mb-4">订阅 MCORE 动态</h3>
                    <p class="text-gray-500 text-sm mb-6">关注视觉资产管理的前沿技术与 MCORE 的最新进展。</p>
                    <div class="space-y-4">
                        <input type="email" placeholder="输入邮箱 (服务申请中)" class="w-full border p-2 text-sm" disabled>
                        <button class="btn-subscribe opacity-50 cursor-not-allowed">立即订阅</button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h4 class="font-bold mb-6">关注我们</h4>
                    <div class="space-y-5 text-sm">
                        <div class="flex items-center gap-3 text-gray-400">
                            <img src="https://img.icons8.com/material-rounded/24/999999/weixing.png" class="w-5">
                            <span>微信公众号：(即将上线)</span>
                        </div>
                        <div class="flex items-center gap-3 text-gray-400">
                            <img src="https://img.icons8.com/material-rounded/24/999999/weibo.png" class="w-5">
                            <span>官方微博：(敬请期待)</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div id="newsModal">
        <div class="max-w-3xl mx-auto">
            <button onclick="closeModal()" class="text-sm font-bold mb-10 opacity-50 hover:opacity-100 transition">← 返回列表</button>
            <h2 id="modalTitle" class="text-3xl font-bold mb-4"></h2>
            <div id="modalDate" class="text-gray-400 text-xs mb-10 tracking-widest uppercase"></div>
            <div id="modalContent" class="text-gray-700 leading-loose space-y-6 text-lg"></div>
        </div>
    </div>

    <footer class="py-20 border-t bg-gray-50 mt-20">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="space-y-2 text-center md:text-left">
                <p class="text-gray-500">联系支持：<span class="text-black font-medium">mcoreservice@126.com</span></p>
                <p class="text-gray-500">微信平台：<span class="text-black font-medium">即将上线</span></p>
                <p class="text-gray-400 text-xs mt-4">运营地点：中国·福建·福州</p>
            </div>
            <div class="text-[10px] text-gray-300 tracking-[0.2em] font-bold">
                MCORE TECHNOLOGY &copy; 2025-2026
            </div>
        </div>
    </footer>

    <script>
        const CONFIG_URL = `https://raw.githubusercontent.com/jasonmartin201919/mcore-activator/main/config.json`;

        async function initPage() {
            try {
                const res = await fetch(`${CONFIG_URL}?v=${Date.now()}`);
                const data = await res.json();
                const news = data.ads?.wenzhang || data.wenzhang || [];
                renderNews(news);
            } catch (e) {
                console.error("News Load Error", e);
                document.getElementById('featuredContainer').innerHTML = '<p class="text-gray-400">内容加载中...</p>';
            }
        }

        function renderNews(news) {
            if (!news.length) return;

            // 1. 渲染焦点大图新闻
            const first = news[0];
            document.getElementById('featuredContainer').innerHTML = `
                <div class="featured-news group" onclick="openModalFromData(0)">
                    <img src="${first.image || first.img || ''}" onerror="this.src='https://images.pexels.com/photos/3183150/pexels-photo-3183150.jpeg?auto=compress&cs=tinysrgb&w=1200'">
                    <div class="mt-8">
                        <span class="text-xs font-bold text-blue-500 uppercase tracking-widest">${first.date || 'LATEST'}</span>
                        <h2 class="text-3xl font-bold mt-2 group-hover:text-blue-600 transition">${first.title}</h2>
                        <p class="text-gray-500 mt-4 leading-relaxed line-clamp-3">${first.summary || ''}</p>
                    </div>
                </div>
            `;

            // 2. 渲染下方列表
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = news.slice(1).map((item, i) => `
                <div class="cursor-pointer group" onclick="openModalFromData(${i + 1})">
                    <div class="overflow-hidden rounded mb-5">
                        <img src="${item.image || item.img || ''}" class="w-full aspect-video object-cover group-hover:scale-105 transition duration-500" onerror="this.style.display='none'">
                    </div>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">${item.date || ''}</span>
                    <h3 class="text-lg font-bold mt-1 group-hover:text-blue-600 transition line-clamp-2">${item.title}</h3>
                </div>
            `).join('');

            window.allNews = news;
        }

        function openModalFromData(index) {
            const item = window.allNews[index];
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDate').innerText = item.date || "";
            document.getElementById('modalContent').innerHTML = (item.content || item.summary || "").split('\n').map(p => `<p class="mb-4">${p}</p>`).join('');
            document.getElementById('newsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('newsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = initPage;
    </script>
</body>
</html>
