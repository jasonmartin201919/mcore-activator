<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>技术探讨 · MCORE 核心技术与算法分享</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --tesla-black: #171a20; --mcore-blue: #3e6ae1; }
        body { 
            background-color: #fff; 
            color: var(--tesla-black); 
            font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif; 
            -webkit-font-smoothing: antialiased; 
        }

        nav { 
            position: fixed; top: 0; width: 100%; height: 56px; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 24px; z-index: 1000; 
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .brand-logo { height: 28px; width: auto; }

        .nav-links a { 
            padding: 8px 16px; font-size: 13px; font-weight: 600; 
            color: var(--tesla-black); transition: 0.3s;
        }

        /* 列表卡片样式 */
        .tech-card { 
            background: #fff; border-radius: 20px; overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #f0f0f0; display: flex; flex-direction: column; height: 100%;
        }
        .tech-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.06); }

        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        #newsModal { display: none; position: fixed; inset: 0; z-index: 2000; background: #fff; overflow-y: auto; padding: 60px 24px; }

        .page-header { background: #f9f9f9; padding: 120px 24px 60px; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <div class="flex items-center">
            <a href="index.html">
                <img src="https://raw.githubusercontent.com/jasonmartin201919/mcore-activator/main/logo02.png" class="brand-logo" alt="MCORE">
            </a>
        </div>
        <div class="nav-links hidden md:flex">
            <a href="index.html">首页</a>
            <a href="tech.html" class="text-blue-600">技术探讨</a>
            <a href="download.html">下载中心</a>
            <a href="news.html">新闻动态</a>
        </div>
        <a href="index.html" class="md:hidden text-xs font-bold">返回首页</a>
    </nav>

    <header class="page-header">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-bold mb-6 tracking-tight">技术探讨</h1>
            <p class="text-gray-500 text-lg leading-relaxed">深入了解 MCORE 背后的图像处理黑科技：从感知哈希到特征向量提取。</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <div id="techGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="h-80 bg-gray-50 rounded-3xl animate-pulse"></div>
            <div class="h-80 bg-gray-50 rounded-3xl animate-pulse"></div>
            <div class="h-80 bg-gray-50 rounded-3xl animate-pulse"></div>
        </div>
    </main>

    <div id="newsModal">
        <div class="max-w-3xl mx-auto">
            <button onclick="closeModal()" class="text-sm font-bold mb-10 block opacity-50 hover:opacity-100 transition">← 返回列表</button>
            <h2 id="modalTitle" class="text-3xl md:text-4xl font-bold mb-6 leading-tight"></h2>
            <div id="modalDate" class="text-gray-400 text-xs mb-10 tracking-widest uppercase"></div>
            <div id="modalContent" class="text-gray-700 leading-relaxed space-y-6 text-lg"></div>
        </div>
    </div>

    <footer class="py-16 border-t border-gray-50 bg-gray-50">
        <div class="max-w-7xl mx-auto px-6 flex flex-col items-center">
            <div class="text-[10px] text-gray-400 font-medium tracking-[0.2em]">MCORE TECHNOLOGY &copy; 2025-2026</div>
        </div>
    </footer>

    <script>
        const CONFIG_URLS = [
            `https://raw.githubusercontent.com/jasonmartin201919/mcore-activator/main/config.json`,
            `https://cdn.jsdelivr.net/gh/jasonmartin201919/mcore-activator@main/config.json`
        ];

        let globalTechData = [];

        async function fetchConfig() {
            for (const url of CONFIG_URLS) {
                try {
                    const res = await fetch(`${url}?v=${Date.now()}`);
                    if (res.ok) return await res.json();
                } catch (e) { console.warn(e); }
            }
            return null;
        }

        async function initPage() {
            const data = await fetchConfig();
            if (data && (data.ads?.jishu || data.jishu)) {
                globalTechData = data.ads?.jishu || data.jishu;
                renderList();
            } else {
                document.getElementById('techGrid').innerHTML = '<p class="col-span-full text-center text-gray-400">暂无技术文章发布</p>';
            }
        }

        function renderList() {
            const container = document.getElementById('techGrid');
            container.innerHTML = globalTechData.map((item, i) => {
                let imageSrc = item.image || item.img || item.src;
                if (!imageSrc && item.content) {
                    const imgMatch = item.content.match(/<img[^>]+src="([^">]+)"/);
                    if (imgMatch) imageSrc = imgMatch[1];
                }
                return `
                <div onclick="openModal(${i})" class="tech-card cursor-pointer group reveal visible">
                    <div class="h-56 bg-gray-100 overflow-hidden">
                        ${imageSrc ? `<img src="${imageSrc}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">` : `<div class="p-8 font-bold flex items-center justify-center h-full text-center text-gray-400 bg-gray-50">${item.title}</div>`}
                    </div>
                    <div class="p-8 flex-1 flex flex-col">
                        <span class="text-[10px] font-bold text-blue-500 mb-3 uppercase tracking-widest">${item.date || 'Technical Report'}</span>
                        <h4 class="text-xl font-semibold group-hover:text-blue-600 transition mb-3 line-clamp-2">${item.title}</h4>
                        <p class="text-gray-400 text-sm line-clamp-3 leading-relaxed">${item.summary || ""}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function openModal(i) {
            const item = globalTechData[i];
            if(!item) return;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDate').innerText = item.date || "";
            const content = (item.content || item.summary || "").replace(/工业级/g, '专业级');
            document.getElementById('modalContent').innerHTML = content.split('\n').map(p => `<p class="mb-4">${p}</p>`).join('');
            document.getElementById('newsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('newsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = initPage;
    </script>
</body>
</html>
